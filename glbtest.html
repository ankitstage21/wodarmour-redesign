<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#EBEBEA}
model-viewer{width:100vw;height:100vh;--poster-color:#EBEBEA}</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head><body>
<model-viewer id="mv" src="models/normatec-mv.glb" camera-controls
  shadow-intensity="1" exposure="1.05" environment-image="neutral"
  camera-orbit="0deg 80deg auto" field-of-view="30deg" disable-tap
  interaction-prompt="none" autoplay></model-viewer>
<script type="module">
  const mv=document.getElementById('mv');
  window.__ready=false;
  mv.addEventListener('load',()=>{window.__ready=true;});
  window.__orbit=(a)=>{mv.cameraOrbit=`${a}deg 80deg auto`; return mv.cameraOrbit;};
</script>
</body></html>
